<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Styling with color</title>
        <meta charset="UTF-8">
        <style>
            #analogous{
                height: 200px;
                width: 200px;
                text-align: center;
                background-color: green;
                color: greenyellow;
                border: outset 5px yellow;
                font-size: x-large;
                
            }
            #complementary{
                height: 200px;
                width: 200px;
                text-align: center;
                background-color: rgb(116, 5, 116);
                color: rgb(250, 250, 71);
                font-size: x-large;

            }
            #triadic{
                height: 200px;
                width: 200px;
                text-align: center;
                background-color: green;
                color: purple;
                border: outset 5px orange;
                font-size: x-large;
            }

        </style>
    </head>
    <body>
        <div id="analogous">
            <p>analogous</p>
        </div>
        <div id="complementary">
            <p>complementary</p>
        </div>
                <div id="triadic">
            <p>triadic</p>
        </div>
        
    </body>
</html>
