<!--AS 6th HTML basics notes-->
<!DOCTYPE html5> <!--what type of markup labguage being used-->
<html>
    <head>
        <title>HTML basics</title> <!--the title in the tab-->
        <meta charset="UTF-8"> <!--using english alphabet-->
        <style>
            body{ 
                background-color: darkorange;
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
                color:darkmagenta;
            }
            .small{
                font-size: 20px;
                text-decoration: underline wavy 4px white;
            }
            #first{
                font-size: 5vh;
                text-align: center;
                border: outset 5px purple;
                border-radius: 10px;
                background-color: rgb(9, 9, 151);
                box-shadow: 10px 5px 5px paleturquoise;
                width: 50%;
            }

        </style> 
    </head> <!--for web browser-->
    <body> <!-- for the user-->
        <h1 id="first">HTML notes!</h1>
        <h2>sub <em>heading</em></h2> <!--em is for italics-->
        <h6 class="small">tiny header</h6>
        <p><span>this is for a <u>paragraph</u></p></span> <!--u is for underlining-->
        <p>jhdfihfishgdjfhgdjfhg. <strong>bolded</strong>djfhkbgjfnbfjhgjfhnbkjfhgjhjghjghkjdhgjfhgjg</p> <br></br> hdwgiuyfewfuygyfg
        <a href="https://ucas-edu.instructure.com/" target="_blank">this is a link</a> <!--a tags make links-->
    </body>
</html> 
<!--break allows the paragraph to be broken to a next line-->
<!--strong is for bolding-->
